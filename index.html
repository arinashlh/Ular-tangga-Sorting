<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ular Tangga Sorting Algorithm</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        :root {
            --bg-color: #d4f1f9; --border-dark: #1e272e;
            --btn-yellow: #f1c40f; --btn-purple: #5f27cd;
            --btn-green: #2ecc71; --btn-red: #e74c3c;
            --panel-bg: #f5f6fa;
        }
        * { box-sizing: border-box; }
        
        body {
            margin: 0; padding: 20px 30px; background-color: var(--bg-color);
            background-image: linear-gradient(rgba(255,255,255,0.3) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.3) 1px, transparent 1px);
            background-size: 20px 20px; font-family: 'Nunito', sans-serif; 
            display: flex; flex-direction: column; gap: 20px; 
            min-height: 100vh; overflow-x: hidden; 
        }

        .pixel-text { font-family: 'Press Start 2P', cursive; }

        /* --- JUDUL GAME INTERAKTIF --- */
        .game-title {
            text-align: center; margin: 5px 0 10px 0;
            font-size: clamp(18px, 2.5vw, 28px); letter-spacing: 3px;
            background: linear-gradient(90deg, #e74c3c, #f1c40f, #2ecc71, #3498db, #9b59b6, #e74c3c);
            background-size: 200% auto; color: transparent;
            -webkit-background-clip: text; background-clip: text;
            text-shadow: 3px 3px 0px rgba(30,39,46,0.2);
            animation: shine 4s linear infinite, floatTitle 3s ease-in-out infinite;
        }
        @keyframes shine { to { background-position: 200% center; } }
        @keyframes floatTitle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        /* --- MAIN LAYOUT --- */
        .main-container { display: flex; flex-direction: row; gap: 30px; flex: 1; }
        
        /* --- KIRI: AREA GAME --- */
        #left-col {
            flex: 1; display: flex; flex-direction: column; align-items: stretch; 
            gap: 20px; min-width: 0;
        }
        
        .top-bar {
            width: 100%; display: flex; justify-content: space-between; align-items: center; 
            background: white; padding: 15px 25px; border-radius: 12px;
            border: 4px solid var(--border-dark); box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        
        .top-left-group { display: flex; align-items: center; gap: 15px; }
        .timer-box {
            background: #e84118; color: white; padding: 10px 20px;
            border-radius: 8px; font-size: 18px; border: 4px solid var(--border-dark);
            box-shadow: 4px 4px 0px var(--border-dark); display: flex; align-items: center; gap: 10px;
        }

        .timer-controls { display: flex; gap: 8px; }
        .btn-mini {
            width: 45px; height: 45px; padding: 0; display: flex; justify-content: center; align-items: center;
            font-size: 14px; border: 4px solid var(--border-dark); box-shadow: 4px 4px 0px var(--border-dark);
            border-radius: 8px; cursor: pointer; color: var(--border-dark); transition: 0.1s;
        }
        .btn-mini:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px var(--border-dark); }
        .btn-mini.bg-green { background: #2ecc71; }
        .btn-mini.bg-yellow { background: #f1c40f; }
        .btn-mini.bg-red { background: #e74c3c; color: white;}

        .badge {
            background: #f1f2f6; padding: 12px 18px; border-radius: 20px;
            font-size: 13px; font-weight: 900; color: #57606f; white-space: nowrap; border: 2px solid #dfe4ea;
        }

        .guru-actions { display: flex; gap: 12px; align-items: center; }
        .btn-guru-inline {
            border: 4px solid var(--border-dark); border-radius: 8px;
            font-size: 10px; font-family: 'Press Start 2P', cursive;
            cursor: pointer; box-shadow: 4px 4px 0px var(--border-dark);
            transition: all 0.1s; text-align: center; padding: 12px 18px; 
            display: flex; align-items: center; justify-content: center; gap: 8px; line-height: 1.5;
        }
        .btn-guru-inline:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px var(--border-dark); }
        .btn-guru-inline.bg-yellow { background: var(--btn-yellow); color: var(--border-dark); }
        .btn-guru-inline.bg-purple { background: var(--btn-purple); color: white; }
        .btn-guru-inline.bg-red { background: #c0392b; color: white; }

        /* --- KANAN: PANEL KONTROL MURID --- */
        #right-col {
            flex: 0 0 380px; background: var(--panel-bg);
            border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            display: flex; flex-direction: column; 
            border: 4px solid var(--border-dark); 
            height: calc(100vh - 40px); position: sticky; top: 20px;
        }

        .panel-scroll-area {
            overflow-y: auto; flex: 1; padding: 25px; scroll-behavior: smooth;
        }
        
        /* Mempercantik Scrollbar untuk Leaderboard */
        .panel-scroll-area::-webkit-scrollbar { width: 8px; }
        .panel-scroll-area::-webkit-scrollbar-track { background: #dfe4ea; border-radius: 10px; }
        .panel-scroll-area::-webkit-scrollbar-thumb { background: #57606f; border-radius: 10px; }

        .panel-section { border-bottom: 4px solid var(--border-dark); padding-bottom: 25px; margin-bottom: 25px;}
        .panel-section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0;}
        
        .player-card {
            background: white; border: 4px solid var(--border-dark); border-radius: 10px;
            padding: 15px; display: flex; align-items: center; gap: 15px; box-shadow: 4px 4px 0px rgba(0,0,0,0.1);
        }
        .avatar-box {
            width: 55px; height: 55px; background: #dfe4ea; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; font-size: 32px; border: 3px solid #ced6e0;
        }
        .player-info h3 { margin: 0 0 5px 0; font-size: 15px; color: var(--border-dark); }
        .player-info p { margin: 0; font-size: 13px; color: #747d8c; font-weight: 900;}
        .player-info b { font-size: 18px; color: #2980b9; }

        .dice-area { display: flex; align-items: center; gap: 15px; margin-top: 25px; }
        .dice-icon {
            width: 70px; height: 70px; background: white; border: 4px solid var(--border-dark);
            border-radius: 10px; display: flex; justify-content: center; align-items: center;
            font-size: 32px; box-shadow: 4px 4px 0px var(--border-dark); transition: transform 0.1s;
        }
        
        @keyframes spinDice3D {
            0% { transform: rotate(0deg) scale(1); background-color: white; }
            50% { transform: rotate(180deg) scale(1.2); background-color: var(--btn-yellow); }
            100% { transform: rotate(360deg) scale(1); background-color: white; }
        }
        .rolling-dice { animation: spinDice3D 0.2s infinite linear !important; color: var(--border-dark); }
        
        .btn {
            border: 4px solid var(--border-dark); border-radius: 8px;
            padding: 18px; font-size: 14px; cursor: pointer;
            box-shadow: 4px 4px 0px var(--border-dark); transition: all 0.1s; 
            text-align: center; color: var(--border-dark); line-height: 1.5; background: var(--btn-green);
        }
        .btn:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px var(--border-dark); }
        .btn:disabled { filter: grayscale(100%); cursor: not-allowed; transform: none; box-shadow: none; opacity: 0.7;}
        
        .rules-text { font-size: 11px; color: #57606f; font-weight: 900; margin-top: 20px; text-align: center; line-height:1.6;}

        #join-section input {
            width: 100%; padding: 18px; border: 4px solid var(--border-dark);
            border-radius: 8px; font-size: 15px; font-weight: bold; font-family: inherit; outline: none;
        }

        .leaderboard-header {
            background: var(--border-dark); color: white; text-align: center; position: sticky; top: -25px; z-index: 10;
            padding: 15px; font-size: 13px; border-radius: 6px; margin-bottom: 20px; letter-spacing: 1px;
        }
        .lb-item {
            border: 3px solid var(--border-dark); border-radius: 8px;
            padding: 12px 15px; display: flex; align-items: center; gap: 12px;
            margin-bottom: 12px; background: #e3f2fd; transition: transform 0.2s;
        }
        .lb-item:hover { transform: scale(1.02); }
        .lb-item h4 { margin: 0 0 5px 0; font-size: 13px; color: var(--border-dark); line-height: 1.3;}
        .lb-item p { margin: 0; font-size: 12px; color: #2980b9; font-weight: bold; }
        .lb-rank { font-size: 14px; color: #7f8c8d; font-weight: bold; width: 25px;}

        /* --- PAPAN RAKSASA --- */
        #board-wrapper {
            position: relative; width: 100%; height: auto; aspect-ratio: 1 / 1;
            border: 8px solid var(--border-dark); border-radius: 8px;
            box-shadow: 8px 8px 0px rgba(0,0,0,0.15); background: white; margin: 0;
        }
        #board {
            width: 100%; height: 100%; display: grid; 
            grid-template-columns: repeat(10, 1fr); grid-template-rows: repeat(10, 1fr);
        }
        .cell {
            border: 1px solid rgba(0,0,0,0.3); display: flex; padding: 5px; 
            font-weight: 900; font-size: clamp(12px, 1.8vmin, 16px); position: relative; 
        }
        .cell:nth-child(even) { background-color: #f1c40f; color: black; }
        .cell:nth-child(odd) { background-color: #e74c3c; color: white;}
        .cell:nth-child(3n) { background-color: #3498db; color: white;}
        .cell:nth-child(5n) { background-color: #2ecc71; color: black;}
        .cell:nth-child(7n) { background-color: #ecf0f1; color: black;}

        #svg-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            pointer-events: none; z-index: 5;
        }

        .player-token {
            width: clamp(24px, 4vmin, 38px); height: clamp(24px, 4vmin, 38px);
            position: absolute; transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 10; transform: translate(-50%, -50%); display: flex; 
            justify-content: center; align-items: center; font-size: clamp(16px, 2.5vmin, 24px);
            background: white; border-radius: 50%; border: 3px solid var(--border-dark);
            box-shadow: 3px 3px 0px rgba(0,0,0,0.3); pointer-events: none; 
        }

        /* --- MODAL --- */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(30,39,46,0.9); z-index: 100; justify-content: center; align-items: center;
        }
        .modal-content {
            background: white; padding: 35px; border-radius: 12px; border: 6px solid var(--border-dark);
            width: 90%; max-width: 550px; box-shadow: 8px 8px 0px rgba(0,0,0,0.5);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); max-height: 90vh; overflow-y: auto;
        }
        
        .pin-input {
            width: 100%; padding: 15px; font-size: 28px; border: 3px solid var(--border-dark);
            border-radius: 6px; margin: 20px 0; text-align: center; font-family: inherit; outline: none; letter-spacing: 10px;
        }

        @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @media (max-width: 1024px) {
            .main-container { flex-direction: column; overflow-y: visible; }
            #left-col, #right-col { width: 100%; flex: none; max-width: 100%; height: auto;}
            #board-wrapper { max-width: 100%; height: auto; margin-bottom: 20px;}
            #right-col { position: relative; height: 500px; top: 0;}
        }
    </style>
</head>
<body>

<h1 class="pixel-text game-title">POST-TEST: ALGORITMA SORTING</h1>

<div class="main-container">
    <div id="left-col">
        <div class="top-bar">
            <div class="top-left-group">
                <div class="timer-box pixel-text" id="timer-display">
                    <span style="font-size:14px;">⏱</span> 15:00
                </div>
                <div class="timer-controls">
                    <button onclick="askPinForAction('timer_start')" title="Mulai Waktu" class="btn-mini bg-green pixel-text">▶</button>
                    <button onclick="askPinForAction('timer_pause')" title="Jeda Waktu" class="btn-mini bg-yellow pixel-text">⏸</button>
                    <button onclick="askPinForAction('timer_reset')" title="Reset Waktu" class="btn-mini bg-red pixel-text">🔄</button>
                </div>
                <span class="badge">Pemain: <b id="player-count-num" style="color:#0984e3; font-size:16px;">0/44</b></span>
            </div>

            <div class="guru-actions">
                <button id="btn-music" class="btn-guru-inline bg-yellow pixel-text">🔊 Musik ON</button>
                <button onclick="askPinForAction('download_csv')" class="btn-guru-inline bg-purple pixel-text">📥 Unduh CSV</button>
                <button onclick="askPinForAction('delete_data')" class="btn-guru-inline bg-red pixel-text">🗑️ Hapus Data</button>
            </div>
        </div>
        
        <div id="board-wrapper">
            <div id="board"></div>
            <svg id="svg-layer" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
        </div>
    </div>

    <div id="right-col">
        <div class="panel-scroll-area">
            <div id="join-section" class="panel-section">
                <h3 class="pixel-text" style="font-size: 14px; text-align: center; margin-bottom:25px; color:#2c3e50; line-height: 1.5;">GABUNG BALAPAN!</h3>
                <input type="text" id="player-name" placeholder="Ketik namamu di sini..." style="margin-bottom: 20px;">
                <button class="btn pixel-text" onclick="joinGame()" style="width: 100%;">MASUK ARENA</button>
            </div>

            <div id="play-section" class="panel-section" style="display: none;">
                <div class="player-card">
                    <div class="avatar-box" id="my-avatar">🦊</div>
                    <div class="player-info">
                        <h3 class="pixel-text" id="my-name">NAMA</h3>
                        <p>Posisi: <b id="current-pos">1</b>/100</p>
                    </div>
                </div>

                <div class="dice-area">
                    <div class="dice-icon pixel-text" id="dice-result">?</div>
                    <button id="btn-roll" class="btn pixel-text" style="flex:1; background:#e74c3c; color:white;" onclick="rollDice()">
                        KOCOK<br>DADU
                    </button>
                </div>
                <p class="rules-text">Jawab benar = Maju. Jawab salah = Dadu Hangus.<br>Kotak Finish terkunci jika misi belum tuntas!</p>
            </div>

            <div class="panel-section" style="flex-grow: 1; border-bottom: none;">
                <div class="leaderboard-header pixel-text">🏆 PAPAN PERINGKAT</div>
                <div id="lb-list"></div>
            </div>
        </div>
    </div>
</div>

<!-- Modal Input PIN Guru -->
<div id="pin-modal" class="modal-overlay">
    <div class="modal-content result-box">
        <h2 class="pixel-text" style="color:#2c3e50; text-align: center;">AKSES GURU</h2>
        <p style="text-align: center;">Masukkan PIN untuk melanjutkan tindakan:</p>
        <input type="password" id="guru-pin-input" class="pin-input" maxlength="4" placeholder="••••">
        <div style="display:flex; gap:15px; margin-top: 10px;">
            <button class="btn pixel-text" style="flex:1; background:#e74c3c; color:white; padding:15px;" onclick="closePinModal()">BATAL</button>
            <button class="btn pixel-text" style="flex:1; background:#2ecc71; padding:15px;" onclick="verifyGuruPin()">MASUK</button>
        </div>
    </div>
</div>

<script>
    const avatars = ["🦊", "🐱", "🐶", "🐼", "🐨", "🦁", "🐯", "🐸", "🐙", "🐧", "🦖", "🦄", "🐵", "🐥"];
    let myId = localStorage.getItem('sortingRaceMyId') || null; 
    let players = JSON.parse(localStorage.getItem('sortingRaceData')) || {};
    
    let timerData = JSON.parse(localStorage.getItem('sortingRaceTimerData')) || { remaining: 900, isRunning: false, endTime: 0 };
    let timerInterval = null;
    let pendingGuruAction = null;

    const ladders = { 2: 38, 21: 42, 33: 68, 51: 89, 71: 91 };
    const snakes = { 24: 7, 58: 36, 73: 47, 85: 64, 98: 79 };

    function init() {
        createBoard();
        updateLeaderboard();
        checkLoginState();
    }

    function checkLoginState() {
        if (myId && players[myId]) {
            document.getElementById('join-section').style.display = 'none';
            document.getElementById('play-section').style.display = 'block';
            document.getElementById('my-name').innerText = players[myId].name.toUpperCase();
            document.getElementById('my-avatar').innerText = players[myId].ava;
            document.getElementById('current-pos').innerText = players[myId].pos;
        }
    }

    function createBoard() {
        const board = document.getElementById('board');
        let html = '';
        for (let row = 0; row < 10; row++) {
            for (let col = 0; col < 10; col++) {
                let cellNum = (row % 2 === 0) ? (100 - (row * 10) - col) : (100 - (row * 10) - (9 - col));
                let labelText = (cellNum === 100) ? "Finish" : (cellNum === 1) ? "Start" : cellNum;
                html += `<div class="cell" id="cell-${cellNum}">${labelText}</div>`;
            }
        }
        board.innerHTML = html;
        drawSnakesAndLadders();
    }

    function drawSnakesAndLadders() {
        const svg = document.getElementById('svg-layer');
        // Visual logic ular tangga (bisa dilengkapi sesuai fungsi asli kamu di atas)
    }

    // --- FUNGSI GABUNG & KLASEMEN (LEADERBOARD) --- //
    
    function joinGame() {
        let nameInput = document.getElementById('player-name').value.trim();
        if(!nameInput) {
            alert("Harap masukkan nama terlebih dahulu!");
            return;
        }
        
        let id = 'player_' + Date.now();
        let randomAva = avatars[Math.floor(Math.random() * avatars.length)];
        
        players[id] = {
            id: id,
            name: nameInput,
            ava: randomAva,
            pos: 1, 
            finishTime: null,
            waktuMulai: Date.now()
        };
        
        myId = id;
        localStorage.setItem('sortingRaceMyId', myId);
        saveData();
        
        checkLoginState();
        updateLeaderboard();
    }

    function saveData() {
        localStorage.setItem('sortingRaceData', JSON.stringify(players));
    }

    function updateLeaderboard() {
        const lbList = document.getElementById('lb-list');
        const playerCountNum = document.getElementById('player-count-num');
        
        let playerArray = Object.values(players);
        playerCountNum.innerText = `${playerArray.length}/44`;

        // ALGORITMA SORTING OTOMATIS: 
        // 1. Posisi tertinggi di atas
        // 2. Jika sama-sama mencapai Finish (pos=100), urutkan berdasarkan Waktu Selesai paling cepat
        playerArray.sort((a, b) => {
            if (b.pos !== a.pos) {
                return b.pos - a.pos; 
            }
            if (a.pos === 100 && a.finishTime && b.finishTime) {
                return a.finishTime - b.finishTime; 
            }
            return 0;
        });

        let html = '';
        playerArray.forEach((p, index) => {
            let rankStr = index + 1;
            let bgColor = "#e3f2fd";
            
            if(rankStr === 1) { rankStr = '🥇'; bgColor = "#fff9c4"; }
            else if(rankStr === 2) { rankStr = '🥈'; bgColor = "#f5f5f5"; }
            else if(rankStr === 3) { rankStr = '🥉'; bgColor = "#ffe0b2"; }
            
            let statusWaktu = (p.pos === 100) ? "<span style='color:#27ae60'>Selesai</span>" : `Pos: ${p.pos}`;

            html += `
                <div class="lb-item" style="background: ${bgColor}">
                    <div class="lb-rank">${rankStr}</div>
                    <div class="avatar-box" style="width:40px; height:40px; font-size:22px; margin-right:5px;">${p.ava}</div>
                    <div style="flex:1;">
                        <h4 style="font-size:14px;">${p.name.toUpperCase()}</h4>
                        <p>${statusWaktu}</p>
                    </div>
                </div>
            `;
        });
        lbList.innerHTML = html;
    }

    // --- FUNGSI DADU (SIMULASI SEMENTARA UNTUK TEST LEADERBOARD) --- //
    function rollDice() {
        if(!myId || !players[myId]) return;
        
        let daduEl = document.getElementById('dice-result');
        daduEl.classList.add('rolling-dice');
        
        setTimeout(() => {
            daduEl.classList.remove('rolling-dice');
            let angkaDadu = Math.floor(Math.random() * 6) + 1;
            daduEl.innerText = angkaDadu;
            
            let p = players[myId];
            p.pos += angkaDadu;
            if(p.pos >= 100) {
                p.pos = 100;
                if(!p.finishTime) p.finishTime = Date.now();
            }
            
            document.getElementById('current-pos').innerText = p.pos;
            saveData();
            updateLeaderboard();
        }, 600);
    }

    // --- FUNGSI PIN GURU & CSV LENGKAP --- //
    function askPinForAction(actionType) {
        pendingGuruAction = actionType;
        document.getElementById('guru-pin-input').value = '';
        document.getElementById('pin-modal').style.display = 'flex';
        document.getElementById('guru-pin-input').focus();
    }

    function closePinModal() {
        document.getElementById('pin-modal').style.display = 'none';
        pendingGuruAction = null;
    }

    function verifyGuruPin() {
        let enteredPin = document.getElementById('guru-pin-input').value;
        if (enteredPin === "0000") { // PIN Default Guru
            let actionToExecute = pendingGuruAction;
            closePinModal(); 
            executeGuruAction(actionToExecute);
        } else {
            alert("PIN Salah!");
            document.getElementById('guru-pin-input').value = '';
        }
    }

    function executeGuruAction(action) {
        if (!action) return;
        
        if (action === 'delete_data') {
            if(confirm("Yakin ingin mereset seluruh data pemain?")) {
                localStorage.removeItem('sortingRaceData');
                localStorage.removeItem('sortingRaceMyId');
                location.reload();
            }
        } else if (action === 'download_csv') {
            // Melanjutkan script CSV yang sebelumnya terputus
            let d = new Date();
            let dStr = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, '0') + "-" + String(d.getDate()).padStart(2, '0');
            
            let csv = "Nama,Karakter,Posisi Terakhir,Waktu Mulai,Waktu Selesai\n";
            
            Object.values(players).forEach(p => { 
                let wMulai = p.waktuMulai ? new Date(p.waktuMulai).toLocaleTimeString() : "-";
                let wSelesai = p.finishTime ? new Date(p.finishTime).toLocaleTimeString() : "Belum Finish";
                csv += `${p.name},${p.ava},${p.pos},${wMulai},${wSelesai}\n`;
            });
            
            let blob = new Blob([csv], { type: 'text/csv' });
            let url = window.URL.createObjectURL(blob);
            let a = document.createElement('a');
            a.setAttribute('hidden', '');
            a.setAttribute('href', url);
            a.setAttribute('download', `Hasil_Game_Sorting_${dStr}.csv`);
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    }

    // Eksekusi awalan
    init();

</script>
</body>
</html>
